<!doctype html>
<html lang="pt-BR">
    <head>
        <title>Pesquisador de GIFs</title>
    </head>
    <body>
        <div class="container">
            <h1>Pesquisador de GIFs</h1>
            <p>Digite o nome do GIF</p>
            <input
                type="text"
                id="search"
                placeholder="Ex: gato, cafe..."
                autofocus
            />
            <button onclick="searchGif()">Buscar GIF</button>
        </div>
        <script>
            function searchGif() {
                let search = document.getElementById("search").value.trim();
                if (search && !search.endsWith(".gif")) {
                    search += ".gif";
                }
                window.location.href = "/" + search;
            }
        </script>
    </body>
</html>
